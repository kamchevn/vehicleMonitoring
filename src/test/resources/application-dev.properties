# NON_KEYWORDS=YEAR: Vehicle.year maps to a column named "year", which H2 2.x treats as a
# reserved word. Without this the vehicle table silently fails to be created, because Hibernate
# only logs DDL failures.
# DB_CLOSE_DELAY=-1: keep the in-memory schema alive across application contexts.
spring.datasource.url=jdbc:h2:mem:testdb;NON_KEYWORDS=YEAR;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# The base configuration pins the PostgreSQL dialect for production. Tests run on H2, so the
# dialect has to be overridden or Hibernate emits PostgreSQL-only DDL that H2 rejects.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Non-production fixture key ("monitoring-backend-local-test!!!"). Never used outside tests.
app.jwt.secret=bW9uaXRvcmluZy1iYWNrZW5kLWxvY2FsLXRlc3QhISE=

app.cors.allowed-origins=http://localhost:3000
