spring.application.name=monitoring-backend
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.confirmation-base-url=${CONFIRMATION_BASE_URL}
app.confirmation-token-expiry-hours=${CONFIRMATION_TOKEN_EXPIRY_HOURS:24}
app.mail.from=${MAIL_FROM}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

server.port=8080
server.address=0.0.0.0

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Mail connectivity should not mark the whole app DOWN (CD health check).
management.health.mail.enabled=false
