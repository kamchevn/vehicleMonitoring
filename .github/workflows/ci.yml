name: Spring Boot CI

on:
  pull_request:
    branches: [backend]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache OWASP Dependency-Check database
        id: dependency-check-cache
        uses: actions/cache@v4
        with:
          path: .dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Verify formatting
        run: mvn spotless:check

      - name: Run checkstyle
        run: mvn checkstyle:check

      - name: Run SpotBugs
        run: mvn spotbugs:check

      - name: Run tests + build
        run: mvn clean verify -Ddependency-check.skip=true

      - name: Run OWASP dependency-check
        run: |
          if [ "${{ steps.dependency-check-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Using cached NVD database (skipping NVD API update)."
            mvn dependency-check:check -DautoUpdate=false
          else
            echo "No cached NVD database; performing one-time update (may take several minutes)."
            mvn dependency-check:check
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-reports
          path: |
            target/checkstyle-result.xml
            target/spotbugsXml.xml
            target/dependency-check-report.html
