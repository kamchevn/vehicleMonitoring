name: Deploy to Compute instance

on:
  push:
    branches:
      - backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT }}
          source: target/*.jar
          target: /tmp/

      - name: Restart Application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT }}

          script: |
            sudo systemctl stop monitoring

            mv /tmp/target/monitoring-backend-0.0.1-SNAPSHOT.jar \
              /home/ubuntu/vehicleMonitoring/target/monitoring-backend-0.0.1-SNAPSHOT.jar

            sudo systemctl start monitoring

            sudo systemctl status monitoring --no-pager

      - name: Health Check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT }}

          script: |

            sleep 10

            for i in {1..40}; do
              if curl -fs http://localhost:8080/actuator/health > /dev/null; then
                echo "Application is healthy."
                exit 0
              fi
            
              echo "Waiting for Spring Boot..."
              sleep 2
            done
            
            echo "Application failed to start."
            exit 1
